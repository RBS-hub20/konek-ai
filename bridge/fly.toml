# fly launch --no-deploy, then fly deploy
app = "konek-ai-bridge"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # A call holds its websocket open, so never stop the machine mid-call.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "30s"
      timeout = "5s"
